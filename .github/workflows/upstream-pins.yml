# Move each upstream image plugin.toml runs to the newest release of its major, one
# rolling pull request per image, through spec's reusable `upstream-pins` (REPO-R98).
name: upstream-pins
on:
  schedule:
    - cron: "30 9 * * 5"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-pins
  cancel-in-progress: false

jobs:
  pins:
    permissions:
      contents: read
    uses: lemonfiber/spec/.github/workflows/upstream-pins.yml@cc2ed68d5d9ada79b3cc6f98a46ca28ae29ac28c # v1.0.176
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
