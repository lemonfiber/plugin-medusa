# Ask the catalogue to move this plugin's pin in the default bundle once the train's
# `release/adapter-pin` merges, through spec's reusable `first-party-bundle` (OPS-R86).
name: bundle
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  bundle:
    permissions:
      contents: read
      pull-requests: read
    uses: lemonfiber/spec/.github/workflows/first-party-bundle.yml@74bf6bf2d9214bed1dcb832f2c1e77855b5a51f5 # v1.0.155
    with:
      pin: adapter
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
