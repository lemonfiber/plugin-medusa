# The supply-chain posture check (Q-R56, Q-R59), called from spec.
name: scorecard
on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: "26 6 * * 1"
permissions:
  contents: read
jobs:
  scorecard:
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    secrets:
      SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
    uses: lemonfiber/spec/.github/workflows/scorecard.yml@b74e6b8ed81d7d0b1adced22ab4b8b3db2a95615 # v1.0.173
